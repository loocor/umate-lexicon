[project]
name = "umate-lexicon"
version = "0.1.0"
description = "Clean-room Rime lexicon factory for uMate"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "uMate contributors" }]
dependencies = []

[project.optional-dependencies]
draft-pinyin = ["pypinyin>=0.54"]
dev = ["pytest>=8.0"]

[project.scripts]
umate-lexicon = "umate_lexicon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umate_lexicon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
